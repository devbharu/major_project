# docker compose up --build        (copy .env.example to .env and fill it in first)
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      TRUST_PROXY: "true"
    volumes: [warren-data:/data]
    restart: unless-stopped
    expose: ["5000"]
  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  warren-data:
